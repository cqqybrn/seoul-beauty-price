name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: Python Pipeline (Ruff & Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Lint with Ruff
        run: uv run ruff check .
      - name: Run offline test suite
        run: uv run pytest -q

  web:
    name: Astro Static Site Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Build static site (empty-catalog fallback)
        run: npm run build
