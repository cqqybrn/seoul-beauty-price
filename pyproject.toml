[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kbeauty-price"
version = "0.1.0"
description = "Evidence-based Seoul dermatology public-offer comparison pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Scrapy==2.13.3",
  "extruct==0.18.0",
  "google-genai==3.3.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "PyYAML==6.0.3",
  "rapidfuzz==3.14.3",
  "tzdata==2025.2",
  "twisted==25.5.0",
]

[project.optional-dependencies]
browser = ["scrapy-playwright==0.0.44"]
dev = ["pytest==9.0.2", "ruff==0.14.8"]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "pipeline/resources/migrations"
"dictionary" = "pipeline/resources/dictionary"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::ResourceWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
